services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-liftryt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-liftryt_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-liftryt}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-liftryt}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Composed here (not in backend/.env) because the credentials are shared
      # with the postgres/redis services defined in this same file.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-liftryt}:${POSTGRES_PASSWORD:-liftryt_dev_password}@postgres:5432/${POSTGRES_DB:-liftryt}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      # Named volume for the sentence-transformers model download (~90MB) —
      # without this it re-downloads from HuggingFace on every container
      # recreation instead of just on first-ever startup.
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    env_file:
      - ./frontend/.env
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # anonymous volume: keeps the image's node_modules from being shadowed by the bind mount above
    depends_on:
      - backend

volumes:
  pg_data:
  hf_cache:
