########################################################################
# Render Blueprint — deploys the backend as a Docker web service plus a
# managed Postgres database. Redis is included since app/core/redis.py
# uses it for real login-attempt rate limiting, not just as a nice-to-have.
#
# To use: Render dashboard -> New -> Blueprint -> connect this repo. Render
# reads this file automatically. Env vars marked `sync: false` are prompted
# for during blueprint setup and stored as secrets — never put real secret
# values in this file, it's committed to a public repo.
#
# Known tradeoffs worth reading before deploying (see the chat writeup for
# the fuller version):
#   - Render's free Postgres plan is deleted after 30 days. Use `starter`
#     (paid) instead if this needs to outlive a demo.
#   - The backend's free web service plan spins down after ~15min idle;
#     the next request pays a cold-start cost, including re-downloading the
#     ~90MB sentence-transformers model on every cold start (no persistent
#     disk on the free plan to cache it across restarts).
#   - Uploaded avatars (backend/app/core/storage.py, local disk) don't
#     survive a redeploy or a free-plan cold-start restart, for the same
#     ephemeral-disk reason. Fine for a demo, not for real user data
#     without adding a Render persistent disk (paid) or real object storage.
########################################################################

databases:
  - name: liftryt-postgres
    plan: free # 30-day expiry — switch to `starter` for anything longer-lived
    postgresMajorVersion: "16"

services:
  - type: redis
    name: liftryt-redis
    plan: starter # Render has no free Redis/Key-Value tier
    ipAllowList: [] # internal-only access from the backend service

  - type: web
    name: liftryt-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: LiftRyt AI

      - key: DATABASE_URL
        fromDatabase:
          name: liftryt-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: liftryt-redis
          property: connectionString

      # Real random secret, set during blueprint creation — never the
      # committed dev default.
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

      - key: FIREBASE_PROJECT_ID
        value: liftryt-ai

      # Predictable given `name: liftryt-backend` above — adjust if you
      # rename the service or attach a custom domain.
      - key: BACKEND_PUBLIC_URL
        value: https://liftryt-backend.onrender.com
      # Firebase Hosting always serves a project at both of these domains.
      - key: CORS_ORIGINS
        value: https://liftryt-ai.web.app,https://liftryt-ai.firebaseapp.com
      - key: FRONTEND_URL
        value: https://liftryt-ai.web.app
