########################################################################
# Render Blueprint — deploys the backend as a Docker web service. Postgres
# and Redis are deliberately NOT Render's own managed offerings (Render's
# free Postgres is deleted after 30 days, and it has no free Redis/Key-
# Value tier at all) — instead DATABASE_URL/REDIS_URL point at free-forever
# external instances (Neon for Postgres, Upstash for Redis), entered as
# secrets during blueprint setup. This keeps the whole stack genuinely
# free, matching a resume/portfolio project's actual requirements.
#
# To use: Render dashboard -> New -> Blueprint -> connect this repo. Render
# reads this file automatically. Env vars marked `sync: false` are prompted
# for during blueprint setup and stored as secrets — never put real secret
# values in this file, it's committed to a public repo.
#
# Before deploying:
#   1. Create a free Postgres database at neon.tech (pgvector is supported
#      out of the box — the app's own migration runs `CREATE EXTENSION
#      vector` on first boot). Copy its connection string for DATABASE_URL
#      below; app/core/config.py normalizes both the driver scheme and
#      Neon's ?sslmode=require automatically, no manual edits needed.
#   2. Create a free Redis database at upstash.com. Copy its connection
#      string (the redis:// or rediss:// one, not the REST API URL) for
#      REDIS_URL below.
#
# Known tradeoffs worth knowing about (see the chat writeup for the fuller
# version):
#   - The backend's free web service plan spins down after ~15min idle;
#     the next request pays a cold-start cost, including re-downloading the
#     ~90MB sentence-transformers model on every cold start (no persistent
#     disk on the free plan to cache it across restarts).
#   - Uploaded avatars (backend/app/core/storage.py, local disk) don't
#     survive a redeploy or a free-plan cold-start restart, for the same
#     ephemeral-disk reason. Fine for a demo, not for real user data
#     without real object storage or a paid persistent disk.
#   - Neon's and Upstash's free tiers auto-pause/idle after inactivity too
#     (data isn't deleted, just resumes on the next connection with a
#     short delay) — expect the very first request after a quiet period
#     to be slow across the whole stack, not just the Render cold start.
########################################################################

services:
  - type: web
    name: liftryt-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: LiftRyt AI

      # Free external instances — see the setup notes above.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

      # Real random secret, set during blueprint creation — never the
      # committed dev default.
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: liquid/lfm-2.5-2.6b:free

      - key: FIREBASE_PROJECT_ID
        value: liftryt-ai

      # Predictable given `name: liftryt-backend` above — adjust if you
      # rename the service or attach a custom domain.
      - key: BACKEND_PUBLIC_URL
        value: https://liftryt-backend.onrender.com
      # Firebase Hosting always serves a project at both of these domains.
      - key: CORS_ORIGINS
        value: https://liftryt-ai.web.app,https://liftryt-ai.firebaseapp.com
      - key: FRONTEND_URL
        value: https://liftryt-ai.web.app
